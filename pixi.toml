[workspace]
name = "asyncio-cpp"
version = "0.0.1"
description = "A C++20 async/await event loop library"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
clangxx = ">=22"
cmake = ">=3.20"
ninja = ">=1.12"

[tasks]
example-configure = { cmd = "cmake -S examples -B examples/build -G Ninja -DCMAKE_CXX_COMPILER=clang++", inputs = ["examples/CMakeLists.txt"] }
example = { cmd = "cmake --build examples/build --target {{ name }} && ./examples/build/{{ name }}", args = [{ arg = "name" }], depends-on = ["example-configure"] }
