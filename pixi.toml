[workspace]
name = "asyncio-cpp"
description = "A C++20 async/await event loop library"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
clangxx = ">=22"
cmake = ">=3.28"
ninja = ">=1.12"

[tasks]
configure = { cmd = "cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_PREFIX=\"$PWD/.local\" -DASYNCIO_SANITIZER={{ sanitizer }}", args = [{ arg = "sanitizer", default = "" }], inputs = ["CMakeLists.txt", "cmake/", "src/"] }
build = { cmd = "cmake --build build", depends-on = ["configure"] }
install = { cmd = "cmake --install build", depends-on = ["build"] }
test = { cmd = "cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_PREFIX=\"$PWD/.local\" -DASYNCIO_SANITIZER={{ sanitizer }} && cmake --build build && cmake --install build && cmake -S tests -B tests/build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH=\"$PWD/.local\" -DASYNCIO_SANITIZER={{ sanitizer }} && cmake --build tests/build && ctest --test-dir tests/build --output-on-failure", args = [{ arg = "sanitizer", default = "" }], inputs = ["CMakeLists.txt", "cmake/", "src/", "tests/"] }
example = { cmd = "cmake -S examples -B examples/build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH=\"$PWD/.local\" && cmake --build examples/build --target {{ name }} && ./examples/build/{{ name }}", args = [{ arg = "name" }], depends-on = ["install"] }
clean = { cmd = "cmake -E rm -rf build tests/build examples/build .local" }
